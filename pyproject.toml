[project]
name = "botjirachi"
version = "0.1.0"
description = "Shiny hunt bot for Jirachi (Pokémon Channel + Ruby) via Dolphin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pynput>=1.7.6"]

[project.scripts]
botjirachi = "botjirachi.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["botjirachi"]
